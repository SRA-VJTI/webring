    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #000000;
            --border: #000000;
            --gray: #666666;
            --card-bg: #fafafa;
            --card-hover: #f5f5f5;
            --logo-filter: invert(0);
            --color-sy: rgba(180, 40, 60, 0.4);
            --color-ty: rgba(56, 140, 56, 0.4);
            --color-final: rgba(89, 46, 131, 0.4);

            --shadow-color: #000000;

        }

        [data-theme="dark"] {
            --bg: #0a0a0a;
            --text: #ffffff;
            --border: #ffffff;
            --gray: #888888;
            --card-bg: #111;
            --card-hover: #161616;
            --logo-filter: invert(1);
            --color-sy: rgba(180, 40, 60, 0.4);
            --color-ty: rgba(56, 140, 56, 0.4);
            --color-final: rgba(89, 46, 131, 0.4);

            --shadow-color: #ffffff;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Color bar */
        .color-bar {
            height: 6px;
            display: flex;
        }

        .color-bar span {
            flex: 1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--border);
            margin-bottom: 2rem;
        }

        .logo {
            width: 72px;
            height: 72px;
            flex-shrink: 0;
            filter: var(--logo-filter);
        }

        .header-text h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .header-text p {
            font-size: 0.875rem;
            color: var(--gray);
            font-weight: 400;
        }

        .theme-toggle {
            margin-left: auto;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--gray);
            transform: rotate(15deg);
        }

        /* Filter Navigation */
        .filter-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--gray);
            padding: 0.4rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--gray);
            color: var(--text);
        }

        .filter-btn.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        /* Active Filter Colors */
        /* Active Filter Colors */
        .filter-btn.ty.active {
            background: rgba(56, 140, 56, 0.1);
            border-color: rgb(56, 140, 56);
            color: rgb(56, 140, 56);
        }

        .filter-btn.ly.active {
            background: rgba(89, 46, 131, 0.1);
            border-color: rgb(89, 46, 131);
            color: rgb(89, 46, 131);
        }

        .filter-btn.final-year.active {
            background: rgba(89, 46, 131, 0.1);
            border-color: rgb(89, 46, 131);
            color: rgb(89, 46, 131);
        }




        /* Section */
        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            color: var(--gray);
        }

        .ly-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
            gap: 1rem;
            padding: 1rem 0;
        }

        .ly-card {
            position: relative;
            border: 2px solid var(--border);
            background: var(--card-bg);
            padding: 1.1rem 1.15rem 1.15rem;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            min-height: 175px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.25s ease;
            overflow: hidden;
        }

        .ly-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: var(--accent);
        }

        .ly-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .ly-card:hover {
            transform: translateY(-4px);
            box-shadow: 5px 5px 0 var(--accent);
        }

        .ly-card:hover::after {
            opacity: 0.07;
        }

        [data-theme="dark"] .ly-card {
            border-color: #262626;
            background: #131313;
        }

        .ly-card-name {
            font-weight: 700;
            font-size: 1.05rem;
            line-height: 1.2;
            margin-top: 0.35rem;
        }

        .ly-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        .ly-tag {
            font-size: 0.68rem;
            padding: 0.2rem 0.55rem;
            border-radius: 50px;
            border: 1px solid var(--accent);
            color: var(--text);
            background: transparent;
        }

        [data-theme="dark"] .ly-tag {
            border-color: #333;
            color: var(--gray);
        }

        .ly-card-pos {
            font-size: 0.58rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--gray);
            margin-top: auto;
            padding-top: 0.7rem;
        }

        .no-link {
            cursor: default;
            opacity: 0.55;
        }

        .no-link:hover {
            transform: none;
            box-shadow: none;
        }


        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        /* Footer */
        footer {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .footer-links a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.8125rem;
            font-weight: 500;
            padding-bottom: 2px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s ease;
        }

        .footer-links a:hover {
            border-bottom-color: var(--text);
        }

        .footer-copy {
            font-size: 0.75rem;
            color: var(--gray);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 2rem 1rem;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .logo {
                width: 56px;
                height: 56px;
            }

            footer {
                flex-direction: column;
                align-items: flex-start;
            }

            .footer-links {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .ly-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }
    </style>
</head>

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? '' : 'dark';

            if (newTheme) {
                html.setAttribute('data-theme', newTheme);
            } else {
                html.removeAttribute('data-theme');
            }
            localStorage.setItem('theme', newTheme);

            icon.textContent = newTheme === 'dark' ? '☀' : '☾';

                "description": "Reinforcement learning, AI/ML",
                "position": ""
            }
        ];

        function parseCSV(text) {
            const rows = [];
            let row = [], field = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (text[i + 1] === '"') { field += '"'; i++; }
                        else { inQuotes = false; }
                    } else { field += c; }
                } else if (c === '"') { inQuotes = true; }
                else if (c === ',') { row.push(field); field = ''; }
                else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
                else if (c !== '\r') { field += c; }
            }
            if (field.length || row.length) { row.push(field); rows.push(row); }
            return rows;
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function displayUrl(u) {
            return u.trim().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/$/, '');
        }

        function keywords(desc) {
            return (desc || '').split(',').map(t => t.trim()).filter(Boolean);
        }

        function accentOf(desc) {
            for (const w of keywords(desc)) {
                const low = ' ' + w.toLowerCase() + ',';
                for (const [, color, keys] of DOMAINS) {
                    if (keys.some(k => low.includes(k))) return color;
                }
            }
            return FALLBACK_COLOR;
        }

        async function fetchTab(gid, year) {
            const res = await fetch(sheetUrl(gid));
            if (!res.ok) throw new Error('sheet ' + res.status);
            const rows = parseCSV(await res.text()).filter(r => r.some(c => c !== ''));
            const [header, ...body] = rows;
            if (!header) return [];
            const head = header.map(h => h.trim());
            const idx = {
                name: head.indexOf('Name'),
                position: head.indexOf('Position'),
                description: head.indexOf('Description (Keywords)'),
                url: head.indexOf('Website / Reference Link')
            };
            if (idx.name < 0 || idx.url < 0) return [];
            return body
                .filter(r => r[idx.name] && r[idx.name].trim())
                .map(r => {
                    const url = (r[idx.url] || '').trim();
                    return {
                        name: r[idx.name].trim(),
                        url: url,
                        display_url: displayUrl(url),
                        year: year,
                        description: (r[idx.description] || '').trim(),
                        position: idx.position >= 0 ? (r[idx.position] || '').trim() : ''
                    };
                });
        }

        async function fetchMembers() {
            const [ty, ly] = await Promise.all([
                fetchTab(TY_GID, 'ty'),
                fetchTab(LY_GID, 'ly')
            ]);
            return ty.concat(ly);
        }

        let all = members;
        let currentFilter = 'ty';

        function visible() {
            return all.filter(m => m.year === currentFilter);
        }

        function filterList(year) {
            currentFilter = year;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.year === year));
            renderMembers(visible());
        }

        function renderMembers(list) {
            const container = document.getElementById('members-container');
            container.className = 'ly-grid fade-in';
            container.innerHTML = list.map(m => {
                const open = m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener"` : '<div';
                const close = m.url ? '</a>' : '</div>';
                return `
                ${open} class="ly-card${m.url ? '' : ' no-link'}" style="--accent: ${accentOf(m.description)}">
                    <div class="ly-card-name">${esc(m.name)}</div>
                    <div class="ly-card-tags">
                        ${keywords(m.description).map(t => `<span class="ly-tag">${esc(t)}</span>`).join('')}
                    </div>
                    ${m.position ? `<span class="ly-card-pos">${esc(m.position)}</span>` : ''}
                ${close}
            `; }).join('');
        }

        function loadMembers() {
            renderMembers(visible());
            fetchMembers()
                .then(list => { if (list.length) { all = list; renderMembers(visible()); } })
                .catch(() => { });
        }

        loadMembers();
    </script>
</body>

</html>
